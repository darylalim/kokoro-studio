[server]
fileWatcherType = "none"

[browser]
# Streamlit's frontend posts session telemetry to data.streamlit.io unless this
# is off, and the option defaults to true. README promises no network calls
# after the one-time model download; this key is what makes that promise true.
gatherUsageStats = false

# "Ai-iro" — Japanese indigo, one design mirrored across both modes. No root
# [theme] keys, so neither mode leaks into the other. TestStreamlitConfig holds
# the rationale and guards every setting in this file.
[theme.dark]
primaryColor = "#4e5fd2"
backgroundColor = "#0b0e1a"
secondaryBackgroundColor = "#222638"
textColor = "#e6e9f4"
borderColor = "#58617f"
codeTextColor = "#b4bee6"
redTextColor = "#ffb4b4"

[theme.dark.sidebar]
primaryColor = "#afb8f2"
borderColor = "#687296"

[theme.light]
primaryColor = "#4e5fd2"
backgroundColor = "#f7f8fc"
secondaryBackgroundColor = "#dfe2f0"
textColor = "#0b0e1a"
borderColor = "#828ba8"
codeTextColor = "#2d3e86"
redTextColor = "#4a002c"
orangeTextColor = "#2b1100"
greenTextColor = "#001c13"
greenBackgroundColor = "#bde8c9"

[theme.light.sidebar]
primaryColor = "#2e40b8"
borderColor = "#727b9d"
