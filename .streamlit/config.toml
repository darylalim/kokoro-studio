[server]
fileWatcherType = "none"

[browser]
# Streamlit's frontend posts session telemetry to data.streamlit.io unless this
# is off, and the option defaults to true. README promises no network calls
# after the one-time model download; this key is what makes that promise true.
gatherUsageStats = false

# No [theme] section on purpose — the app renders in Streamlit's stock light and
# dark themes. TestStreamlitConfig holds the rationale and guards every setting
# in this file.
