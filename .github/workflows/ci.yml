name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, type-check, test
    # mlx / mlx-metal are gated to sys_platform == 'darwin' in uv.lock, so the
    # full dependency set only resolves on Apple Silicon.
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Pinned to a full version on purpose: setup-uv stopped publishing
      # floating major tags after v7, so `@v10` would not resolve.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      # --locked installs exactly from uv.lock AND fails if the lock has drifted
      # from pyproject.toml, so a stale lockfile is caught here.
      - run: uv sync --locked --group dev

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      # Mocked unit suite only (testpaths = ["tests"]); tests_integration/ needs
      # the real modules plus the ~355 MB model download.
      - run: uv run pytest
