version: 2

updates:
  # Neither action pin refreshes on its own: setup-uv stopped publishing
  # floating major tags after v7, and release.yml is SHA-pinned because it runs
  # with `contents: write`. Dependabot is what keeps both current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
